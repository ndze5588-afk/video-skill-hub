<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="poster.css">
<style>
.phones { display: flex; gap: 40px; justify-content: center; }
.phone { padding: 14px; border-radius: 56px; background: #15171c; box-shadow: 0 30px 60px rgb(21 23 28 / 0.18); }
.phone .frame { width: 420px; height: 980px; border-radius: 42px; border: 0; }
</style>
</head>
<body>
<div class="poster">
  <div class="eyebrow"><span class="mark"></span>随时查</div>
  <h1 style="font-size:104px">手机上<span class="hl">也能看</span></h1>
  <div class="phones">
    <div class="phone"><div class="frame" data-site-width="390"></div></div>
    <div class="phone"><div class="frame" data-site-width="390" data-target="#bin" data-offset="12"></div></div>
  </div>
</div>
<script src="poster.js"></script>
</body>
</html>
