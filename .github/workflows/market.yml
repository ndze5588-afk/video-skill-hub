name: Sync marketplace

# Keeps .claude-plugin/marketplace.json in step with data/skills.json after every change on main,
# so a new skill becomes installable without waiting for the weekly refresh.
on:
  push:
    branches: [main]
    paths:
      - data/skills.json
      - scripts/sync-market.mjs
      - scripts/build.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-market.mjs
      - run: node scripts/build.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data .claude-plugin
          git diff --cached --quiet || git commit -m "chore: sync marketplace"
          git push
